services:
  - type: web
    name: telegram-digital-shop
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KHPAY_API_KEY
        sync: false
      - key: KHPAY_BASE_URL
        value: https://khpay.site/api/v1
      - key: STOCK_ENCRYPTION_KEY
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "20"
